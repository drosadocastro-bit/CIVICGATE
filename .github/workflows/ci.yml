name: CivicGate validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --junitxml=artifacts/tests.xml
      - run: python scripts/evaluate.py
      - run: python scripts/run_m2_benchmarks.py
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t civicgate:test .
      - run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp --entrypoint civicgate civicgate:test demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: python scripts/container_smoke.py
