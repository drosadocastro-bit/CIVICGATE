[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicgate"
version = "0.1.0"
description = "Sandbox governed MCP access to public federal spending data"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "pydantic>=2.11,<3", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "mypy>=1.15", "pip-audit>=2.9"]

[project.scripts]
civicgate = "civicgate.cli:main"
civicgate-mcp = "civicgate.mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatter owns wrapping; prompts and regexes remain readable.

[tool.mypy]
python_version = "3.11"
strict = true
